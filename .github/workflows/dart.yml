name: iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
      - run: flutter pub get
        working-directory: dart
      - run: flutter build ios --no-codesign
        working-directory: dart
